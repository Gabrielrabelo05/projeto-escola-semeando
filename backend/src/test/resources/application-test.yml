spring:
  datasource:
    url: jdbc:h2:mem:semeando;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
semeando:
  seguranca:
    # Os testes que dependem do 2FA obrigatório ligam a regra no próprio teste (DoisFatoresE2ETest).
    dois-fatores-obrigatorio: ${DOIS_FATORES_PERFIS:}
  inpc:
    modo: nenhum
  agendamentos:
    habilitado: false
  arquivos:
    diretorio: ${java.io.tmpdir}/semeando-testes
  seed:
    habilitado: true
